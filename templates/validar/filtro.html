                    <td>

    <script>
        document.getElementById("busquedaCodCurso").addEventListener("input", function () {
            let filtro = this.value.toLowerCase().trim();
            let filas = document.querySelectorAll("#tablaResultados tbody tr");
            let hayCoincidencias = false;

            filas.forEach(fila => {
                let contenidoFila = fila.textContent.toLowerCase();
                if (contenidoFila.includes(filtro)) {
                    fila.style.display = "";
                    hayCoincidencias = true;
                } else {
                    fila.style.display = "none";
                }
            });

            document.getElementById("mensajeNoResultados").style.display = hayCoincidencias ? "none" : "block";
        });

        function generarDiploma(identificacion) {
            const safeId = encodeURIComponent(identificacion); // Evitar caracteres peligrosos
            const checkbox = document.getElementById(chk_${identificacion});
            const mostrarId = checkbox.checked ? "true" : "false"; // Verificar si el checkbox está marcado

            fetch(/diploma/${safeId}?mostrar_id=${mostrarId})
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => { throw new Error(text || 'Error al generar el diploma'); });
                    }
                    return response.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = diploma_${safeId}.pdf;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                })
                .catch(error => {
                    alert("Error: " + error.message);
                });
        }
    </script>

{% endblock %} -->
