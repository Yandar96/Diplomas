{% extends "layout.html" %}

{% block content %}
<h1 class="mb-4 text-center text-primary">Ver Diplomas</h1>

<!-- Barra de búsqueda -->
<div class="input-group mb-3">
    <input type="text" id="search" class="form-control" placeholder="🔎 Buscar por nombre o matrícula...">
</div>

<!-- Tabla de diplomas con nuevo diseño -->
<div class="table-responsive">
    <table class="table table-hover table-bordered shadow-sm text-center align-middle">
        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre Completo</th>
                <th>Matrícula</th>
                <th>Curso</th>
                <th>Funciones</th>
            </tr>
        </thead>
        <tbody id="tableBody" class="table-light">
            {% for diploma in diplomas %}
            <tr>
                <td>{{ diploma.codigo }}</td>
                <td class="fw-bold">{{ diploma.nombreCompleto }}</td>
                <td>{{ diploma.matricula }}</td>
                <td>{{ diploma.curso }}</td>
                <td>
                    <button class="btn btn-sm btn-info"><i class="fas fa-eye"></i> Ver</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Script para filtrar la tabla -->
<script>
document.getElementById("search").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row => {
        let nombre = row.cells[1].textContent.toLowerCase();
        let matricula = row.cells[2].textContent.toLowerCase();
        row.style.display = (nombre.includes(filter) || matricula.includes(filter)) ? "" : "none";
    });
});
</script>

<!-- FontAwesome para los iconos -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>

{% endblock %}
