{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Lista de Usuarios</h2>
    <a href="{{ url_for('usuario.agregar_usuario') }}" class="btn btn-primary">Agregar Usuario</a>
    <table class="table mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario[0] }}</td>
                <td>{{ usuario[1] }}</td>
                <td>{{ usuario[2] }}</td>
                <td>
                    <a href="{{ url_for('usuario.editar_usuario', id=usuario[0]) }}" class="btn btn-warning btn-sm">Editar</a>
                    <form action="{{ url_for('usuario.eliminar_usuario', id=usuario[0]) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
