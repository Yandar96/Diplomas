{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2 class="mt-4">Editar Curso</h2>

    <form action="{{ url_for('curso.editar_curso', codigo=curso[0]) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ curso[1] }}" required>
        </div>

        <div class="mb-3">
            <label for="diploma" class="form-label">Diploma (PDF)</label>
            <input type="file" class="form-control" id="diploma" name="diploma" accept=".pdf">
            {% if curso[2] %}
                <p>Diploma actual: <a href="{{ url_for('static', filename=curso[2]) }}" target="_blank">Ver PDF</a></p>
            {% endif %}
            <input type="hidden" name="ruta_actual" value="{{ curso[2] }}">
        </div>

        <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
</div>
{% endblock %}
